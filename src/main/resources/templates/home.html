<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Início</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f1f5f9;
        }
        .navbar {
            background-color: #1e40af;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4">
    <span class="navbar-brand mb-0 h1">SAEP - Controle de Estoque</span>
    <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Sair</a>
</nav>

<div class="container mt-5">
    <!-- Requisito 5: login correto reconhecido com sucesso -->
    <div class="alert alert-success">
        Login realizado com sucesso! Bem-vindo(a),
        <strong th:text="${usuario.nome != null and !usuario.nome.isEmpty()} ? ${usuario.nome} : ${usuario.login}"></strong>.
    </div>

    <div class="row mt-4">
        <div class="col-md-6 mb-3">
            <div class="card p-4 shadow-sm">
                <h5>Produtos</h5>
                <p class="text-muted">Gerenciar cadastro de produtos.</p>
                <a th:href="@{/produtos}" class="btn btn-primary">Acessar</a>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card p-4 shadow-sm">
                <h5>Movimentações</h5>
                <p class="text-muted">Registrar entradas e saídas de estoque.</p>
                <a th:href="@{/movimentacoes}" class="btn btn-primary">Acessar</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
